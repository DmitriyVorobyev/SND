<h1>Справочник "Классификатор использования рабочего времени"</h1>
<p class="Usual" valign="bottom">Значения из этого справочника выбираются в форме элемента плана видов расчета <a href="../idn0"><strong class="ControlElement"><font color="#0000ff">Основные начисления</font></strong></a><em> </em>и задают обозначение, под которым данное начисление будет отражено в <strong class="ControlElement"><a href="../idn0">табеле учета рабочего времени</a></strong> (форма Т-13).</p></body></html>
