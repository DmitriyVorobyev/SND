<h1>Документ Регистрация изменений рисков проектов</h1>
<h2>Назначение</h2>
<p>Документ "Регистрация изменений рисков проектов" является служебным и предназначен для регистрации изменений рисков проекта. Документ создается автоматически при записи изменений элемента справочника <a href="Catalog.упоРискиПроектов/Help">Риски проектов</a>.</p></body></html>
